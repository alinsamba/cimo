<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cimo Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="alternate icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="cimo-app">
    <!-- Top Header & Title Bar with Gradient Scrim -->
    <header class="custom-titlebar" id="custom-titlebar">
      <div class="titlebar-left">
        <div class="app-brand">
          <img class="app-brand-logo" src="/logo.svg" alt="Cimo" width="24" height="24">
          <span>Cimo</span>
        </div>
        <div class="title-container">
          <span class="media-title-display" id="media-title-display">No media loaded</span>
          <div class="media-badges-container" id="media-badges-container"></div>
        </div>
      </div>
      <div class="titlebar-right">
        <button id="btn-open-file-top" class="btn-icon" title="Open Media File">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
        <button id="btn-top-drawer" class="btn-icon" title="Toggle Library Drawer (Tab / D)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Video Stage -->
    <main class="video-stage" id="video-stage">
      <video id="cimo-video" tabindex="0"></video>

      <!-- Ambient Watermark Display Layer -->
      <div class="watermark-overlay" id="watermark-overlay">
        <img class="watermark-image" id="watermark-image" src="/watermark-white.png" alt="Cimo Watermark">
      </div>

      <!-- Subtitle Overlay Layer -->
      <!-- Gesture Feedback HUD -->
      <div class="gesture-feedback-hud" id="gesture-feedback-hud">
        <div class="gesture-icon" id="gesture-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </div>
        <div class="gesture-label">Volume 100%</div>
        <div class="gesture-bar">
          <div class="gesture-bar-fill"></div>
        </div>
      </div>
    </main>

    <!-- Floating HUD Controls (Distraction-Free Pill Dock) -->
    <div class="floating-hud" id="floating-hud">
      <!-- Dedicated Timeline Row -->
      <div class="timeline-row">
        <div class="scrubber-container" id="scrubber-container">
          <div class="scrubber-track">
            <div class="scrubber-buffered" id="scrubber-buffered"></div>
            <div class="scrubber-played" id="scrubber-played"></div>
            <div class="scrubber-thumb" id="scrubber-thumb"></div>
          </div>
          <div class="scrubber-tooltip" id="scrubber-tooltip">00:00</div>
        </div>
        <div class="time-display">
          <span class="time-current" id="time-current">00:00</span>
          <span class="time-separator">/</span>
          <span class="time-duration" id="time-duration">00:00</span>
        </div>
      </div>

      <!-- Balanced Controls Row -->
      <div class="controls-row">
        <!-- Left: Playback Controls & Compact Volume -->
        <div class="controls-left">
          <button id="btn-prev" class="btn-icon" title="Previous (Shift+P)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="19 20 9 12 19 4 19 20" fill="currentColor"></polygon>
              <line x1="5" y1="19" x2="5" y2="5" stroke-width="2.2"></line>
            </svg>
          </button>
          <button id="btn-skip-back" class="btn-icon" title="Skip -10s (J)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
              <text x="12" y="15.2" text-anchor="middle" font-size="8" font-family="var(--font-mono)" font-weight="700" fill="currentColor" stroke="none">10</text>
            </svg>
          </button>
          <button id="btn-play-pause" class="btn-icon btn-primary-action" title="Play/Pause (Space / K)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </button>
          <button id="btn-skip-fwd" class="btn-icon" title="Skip +10s (L)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
              <path d="M21 3v5h-5"></path>
              <text x="12" y="15.2" text-anchor="middle" font-size="8" font-family="var(--font-mono)" font-weight="700" fill="currentColor" stroke="none">10</text>
            </svg>
          </button>
          <button id="btn-next" class="btn-icon" title="Next (N)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 4 15 12 5 20 5 4" fill="currentColor"></polygon>
              <line x1="19" y1="5" x2="19" y2="19" stroke-width="2.2"></line>
            </svg>
          </button>

          <!-- Volume Control with Hover Tooltip -->
          <div class="volume-control" id="volume-control">
            <button id="btn-volume" class="btn-icon" title="Mute/Unmute (M)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke="currentColor" stroke-width="2"></path>
              </svg>
            </button>
            <div class="volume-slider-container" id="volume-slider-container">
              <div class="volume-slider-fill" id="volume-slider-fill"></div>
              <div class="volume-tooltip" id="volume-tooltip">100%</div>
            </div>
          </div>
        </div>

        <!-- Segment Divider -->
        <div class="dock-divider"></div>

        <!-- Right: Utility & Setting Toggles -->
        <div class="controls-right">
          <div class="popover-container">
            <button id="btn-speed" class="btn-icon btn-text" title="Playback Speed ([ / ])">
              <span id="speed-display-label">1x</span>
              <svg class="chevron-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="popover-menu" id="speed-menu"></div>
          </div>

          <!-- Subtitles [CC] Menu -->
          <div class="popover-container">
            <button id="btn-subtitles" class="btn-icon" title="Subtitles (S / V)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="3"></rect>
                <path d="M7 15h2a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2H7"></path>
                <path d="M13 15h2a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-2"></path>
              </svg>
            </button>
            <div class="popover-menu" id="subtitles-menu"></div>
          </div>

          <!-- Audio Tracks Waveform Menu -->
          <div class="popover-container">
            <button id="btn-audio" class="btn-icon" title="Audio Tracks (A / B)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 10v4"></path>
                <path d="M8 7v10"></path>
                <path d="M12 3v18"></path>
                <path d="M16 7v10"></path>
                <path d="M20 10v4"></path>
              </svg>
            </button>
            <div class="popover-menu" id="audio-menu"></div>
          </div>

          <!-- Aspect Ratio Viewfinder Menu -->
          <div class="popover-container">
            <button id="btn-aspect-ratio" class="btn-icon" title="Aspect Ratio (C)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 3H4a1 1 0 0 0-1 1v3"></path>
                <path d="M17 3h3a1 1 0 0 1 1 1v3"></path>
                <path d="M21 17v3a1 1 0 0 1-1 1h-3"></path>
                <path d="M3 17v3a1 1 0 0 0 1 1h3"></path>
                <rect x="7" y="7" width="10" height="10" rx="1.5" stroke-dasharray="2 2"></rect>
              </svg>
            </button>
            <div class="popover-menu" id="aspect-ratio-menu"></div>
          </div>

          <!-- Duotone Picture-in-Picture -->
          <button id="btn-pip" class="btn-icon" title="Picture in Picture (P)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="3"></rect>
              <rect x="12" y="11" width="8" height="6" rx="1.5" fill="rgba(217, 70, 239, 0.3)" stroke="currentColor" stroke-width="1.5"></rect>
            </svg>
          </button>

          <!-- Fullscreen Expand -->
          <button id="btn-fullscreen" class="btn-icon" title="Fullscreen (F / F11)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h6v6"></path>
              <path d="M9 21H3v-6"></path>
              <path d="M21 3l-7 7"></path>
              <path d="M3 21l7-7"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Slide-Out Library Drawer with Segmented Pill Tabs & Persistent Footer -->
    <aside class="library-drawer" id="library-drawer" aria-label="Media Library Drawer">
      <!-- 1. Header with Title & Close Button -->
      <div class="drawer-header">
        <div class="drawer-header-title-wrap">
          <span class="drawer-title">Media Library</span>
          <span class="drawer-count-badge" id="drawer-item-count">0 items</span>
        </div>
        <button id="btn-close-drawer" class="btn-icon" title="Close Drawer (Esc)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- 2. Segmented Pill Tab Bar directly below header -->
      <div class="drawer-tabs-wrapper">
        <div class="drawer-tabs" role="tablist">
          <button class="drawer-tab active" data-tab="queue" role="tab" aria-selected="true" tabindex="0">Queue</button>
          <button class="drawer-tab" data-tab="playlists" role="tab" aria-selected="false" tabindex="0">Playlists</button>
          <button class="drawer-tab" data-tab="history" role="tab" aria-selected="false" tabindex="0">History</button>
          <button class="drawer-tab" data-tab="media" role="tab" aria-selected="false" tabindex="0">All Media</button>
        </div>
      </div>

      <!-- 3. Contextual Search Bar -->
      <div class="drawer-search">
        <div class="search-input-wrapper">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="drawer-search-input" class="search-input" placeholder="Search queue..." aria-label="Search library">
          <button id="btn-clear-search" class="btn-clear-search" title="Clear search" style="display: none;">✕</button>
        </div>
      </div>

      <!-- 4. Scrollable List Content Area -->
      <div class="drawer-content" id="drawer-content-area" tabindex="0" role="region" aria-label="Library Content"></div>

      <!-- 5. Persistent Pinned Bottom Utility Dock -->
      <div class="drawer-footer" id="drawer-footer">
        <div class="drawer-footer-actions">
          <button id="btn-drawer-open-files" class="btn-footer-action" title="Open local media files">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>+ Files</span>
          </button>
          <button id="btn-drawer-open-folder" class="btn-footer-action" title="Scan directory for media">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              <line x1="12" y1="11" x2="12" y2="17"></line>
              <line x1="9" y1="14" x2="15" y2="14"></line>
            </svg>
            <span>+ Folder</span>
          </button>
          <div class="drawer-footer-dynamic" id="drawer-footer-dynamic"></div>
        </div>
      </div>
    </aside>

    <!-- Drag and Drop Overlay -->
    <div class="drag-drop-overlay" id="drag-drop-overlay">
      <div class="drag-drop-icon">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          <line x1="12" y1="11" x2="12" y2="17"></line>
          <polyline points="9 14 12 11 15 14"></polyline>
        </svg>
      </div>
      <div class="drag-drop-text">Drop Media or Subtitle Files Here</div>
    </div>
    <input type="file" id="file-input-subtitles" accept=".srt,.vtt,.ass,.ssa" style="display: none;">
  </div>

  <script type="module" src="app.ts"></script>
</body>
</html>
