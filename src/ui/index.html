<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cimo Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="cimo-app">
    <!-- Custom Frameless Titlebar (Desktop) -->
    <header class="custom-titlebar" id="custom-titlebar">
      <div class="titlebar-left">
        <div class="app-brand">
          <div class="app-brand-icon"></div>
          <span>Cimo</span>
        </div>
        <span class="media-title-display" id="media-title-display">No media loaded</span>
      </div>
      <div class="titlebar-right">
        <button id="btn-open-file-top" class="btn-icon" title="Open Media File">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
        <button id="btn-top-drawer" class="btn-icon" title="Toggle Library Drawer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Video Stage -->
    <main class="video-stage" id="video-stage">
      <video id="cimo-video" tabindex="0"></video>

      <!-- Subtitle Overlay Layer -->
      <div id="subtitle-overlay"></div>

      <!-- Gesture Feedback HUD -->
      <div class="gesture-feedback-hud" id="gesture-feedback-hud">
        <div class="gesture-icon">🔊</div>
        <div class="gesture-label">Volume 100%</div>
        <div class="gesture-bar">
          <div class="gesture-bar-fill"></div>
        </div>
      </div>
    </main>

    <!-- Floating HUD Controls (Distraction-Free) -->
    <div class="floating-hud" id="floating-hud">
      <!-- Scrubber Bar -->
      <div class="scrubber-container" id="scrubber-container">
        <div class="scrubber-track">
          <div class="scrubber-buffered" id="scrubber-buffered"></div>
          <div class="scrubber-played" id="scrubber-played"></div>
          <div class="scrubber-thumb" id="scrubber-thumb"></div>
        </div>
        <div class="scrubber-tooltip" id="scrubber-tooltip">00:00</div>
      </div>

      <!-- Controls Row -->
      <div class="controls-row">
        <!-- Left: Playback & Volume -->
        <div class="controls-left">
          <button id="btn-prev" class="btn-icon" title="Previous (Shift+P)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="19 20 9 12 19 4 19 20"></polygon>
              <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line>
            </svg>
          </button>
          <button id="btn-skip-back" class="btn-icon" title="Skip -10s (J)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 4v6h6"></path>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
          </button>
          <button id="btn-play-pause" class="btn-icon btn-primary-action" title="Play/Pause (Space / K)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </button>
          <button id="btn-skip-fwd" class="btn-icon" title="Skip +10s (L)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6"></path>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
          <button id="btn-next" class="btn-icon" title="Next (N)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line>
            </svg>
          </button>

          <!-- Volume -->
          <div class="volume-control">
            <button id="btn-volume" class="btn-icon" title="Mute/Unmute (M)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke="currentColor" stroke-width="2"></path>
              </svg>
            </button>
            <div class="volume-slider-container" id="volume-slider-container">
              <div class="volume-slider-fill" id="volume-slider-fill"></div>
            </div>
            <span class="volume-label" id="volume-label">100%</span>
          </div>

          <!-- Time Display -->
          <div class="time-display">
            <span class="time-current" id="time-current">00:00</span>
            <span>/</span>
            <span class="time-duration" id="time-duration">00:00</span>
          </div>
        </div>

        <!-- Right: Settings & Menus -->
        <div class="controls-right">
          <!-- Speed -->
          <div class="popover-container">
            <button id="btn-speed" class="btn-icon" title="Playback Speed ([ / ])" style="font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600; width: auto; padding: 0 0.5rem;">1x</button>
            <div class="popover-menu" id="speed-menu"></div>
          </div>

          <!-- Subtitles -->
          <div class="popover-container">
            <button id="btn-subtitles" class="btn-icon" title="Subtitles (S)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="M7 15h4M15 15h2M7 11h2M13 11h4"></path>
              </svg>
            </button>
            <div class="popover-menu" id="subtitles-menu"></div>
          </div>

          <!-- Audio Tracks -->
          <div class="popover-container">
            <button id="btn-audio" class="btn-icon" title="Audio Tracks (A)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
              </svg>
            </button>
            <div class="popover-menu" id="audio-menu"></div>
          </div>

          <!-- Aspect Ratio -->
          <div class="popover-container">
            <button id="btn-aspect-ratio" class="btn-icon" title="Aspect Ratio (C)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="6" width="20" height="12" rx="2"></rect>
              </svg>
            </button>
            <div class="popover-menu" id="aspect-ratio-menu"></div>
          </div>

          <!-- Picture in Picture -->
          <button id="btn-pip" class="btn-icon" title="Picture in Picture (P)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <rect x="12" y="10" width="8" height="6" rx="1" fill="currentColor"></rect>
            </svg>
          </button>

          <!-- Fullscreen -->
          <button id="btn-fullscreen" class="btn-icon" title="Fullscreen (F / F11)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
          </button>

          <!-- Drawer Toggle -->
          <button id="btn-drawer" class="btn-icon" title="Library Drawer (D)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Slide-Out Library Drawer -->
    <aside class="library-drawer" id="library-drawer">
      <div class="drawer-header">
        <span class="drawer-title">Media Library</span>
        <button id="btn-close-drawer" class="btn-icon" title="Close">✕</button>
      </div>

      <div class="drawer-search">
        <input type="text" id="drawer-search-input" class="search-input" placeholder="Search title or artist...">
      </div>

      <div class="drawer-tabs">
        <button class="drawer-tab active" data-tab="queue">Queue</button>
        <button class="drawer-tab" data-tab="playlists">Playlists</button>
        <button class="drawer-tab" data-tab="history">History</button>
        <button class="drawer-tab" data-tab="media">Library</button>
      </div>

      <div style="display: flex; gap: 0.5rem; padding: 0.5rem 1.25rem; border-bottom: 1px solid var(--border-subtle);">
        <button id="btn-drawer-open-files" class="btn-icon" style="width: auto; padding: 0 0.5rem; font-size: 0.75rem;">+ Open Files</button>
        <button id="btn-drawer-open-folder" class="btn-icon" style="width: auto; padding: 0 0.5rem; font-size: 0.75rem;">+ Scan Folder</button>
      </div>

      <div class="drawer-content" id="drawer-content-area"></div>
    </aside>

    <!-- Drag and Drop Overlay -->
    <div class="drag-drop-overlay" id="drag-drop-overlay">
      <div class="drag-drop-icon">📂</div>
      <div class="drag-drop-text">Drop Media or Subtitle Files Here</div>
    </div>

    <!-- Hidden file input elements -->
    <input type="file" id="file-input-media" multiple accept="video/*,audio/*" style="display: none;">
    <input type="file" id="file-input-subtitles" accept=".srt,.vtt,.ass,.ssa" style="display: none;">
  </div>

  <script type="module" src="app.ts"></script>
</body>
</html>
